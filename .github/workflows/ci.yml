name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The VM images and their package sets drift underneath us - a DragonFly
  # image once shipped a libcurl its own libssh2 could not satisfy - so build
  # and test on a schedule as well, not only when something here changes.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

env:
  # "make plist" needs the packing lists, which belong to the packaging and so
  # live in the overlays rather than here.
  #
  #   https://github.com/zakinko/pkgsrc-zakinko
  #   https://github.com/zakinko/ports-zakinko
  PKGSRC_OVERLAY_REF: main
  PORTS_OVERLAY_REF: main

jobs:
  # Runs on the host, not in a VM: the check needs git, and it is the same
  # answer on every platform.
  ident:
    name: ident line
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sh tests/check_ident.sh

  # NetBSD is the reference platform: this is the nsswitch interface it
  # designed, and the other two are adaptations of what works here.
  netbsd:
    name: NetBSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zakinko/pkgsrc-zakinko
          ref: ${{ env.PKGSRC_OVERLAY_REF }}
          path: overlay-pkgsrc
      - name: Build and test
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          prepare: |
            /usr/sbin/pkg_add curl
            /usr/sbin/pkg_add python312 || /usr/sbin/pkg_add python311 || /usr/sbin/pkg_add python310
          run: |
            set -e
            uname -a
            echo "== build =="
            make
            ls -l nss_stns.so.0 stns-key-wrapper
            echo "== exported symbols =="
            make symbols
            echo "== packaging lists =="
            make plist
            echo "== bundled third party code =="
            make external
            echo "== unit tests and module registration =="
            make test
            echo "== integration tests =="
            PYTHON=$(ls /usr/pkg/bin/python3.[0-9]* 2>/dev/null | head -1)
            test -n "$PYTHON" || { echo "no python3 found" >&2; exit 1; }
            PYTHON="$PYTHON" make integration

  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zakinko/ports-zakinko
          ref: ${{ env.PORTS_OVERLAY_REF }}
          path: overlay-ports
      - name: Build and test
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y curl python3
          run: |
            set -e
            uname -a
            echo "== build =="
            make
            ls -l nss_stns.so.1 stns-key-wrapper
            echo "== exported symbols =="
            make symbols
            echo "== packaging lists =="
            make plist
            echo "== bundled third party code =="
            make external
            echo "== unit tests and module registration =="
            make test
            echo "== unit tests under AddressSanitizer / UBSan =="
            make asan
            echo "== integration tests =="
            PYTHON=python3 make integration

  dragonfly:
    name: DragonFly BSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zakinko/ports-zakinko
          ref: ${{ env.PORTS_OVERLAY_REF }}
          path: overlay-ports
      - name: Build and test
        uses: vmactions/dragonflybsd-vm@v1
        with:
          usesh: true
          prepare: |
            # The stock image ships a libcurl newer than its libssh2, which
            # leaves libcurl.so.4 with an unresolved symbol; bring the whole
            # package set up to date before installing.
            pkg update -f
            pkg upgrade -y
            pkg install -y curl python3
          run: |
            set -e
            uname -a
            echo "== build =="
            make
            ls -l nss_stns.so.1 stns-key-wrapper
            echo "== exported symbols =="
            make symbols
            echo "== packaging lists =="
            make plist
            echo "== bundled third party code =="
            make external
            echo "== unit tests and module registration =="
            make test
            echo "== integration tests =="
            PYTHON=python3 make integration
